site_name: Py-RPAutom
dev_addr: localhost:9999
repo_url: https://github.com/aranseiki/py-rpautom
repo_name: py-rpautom
remote_branch: gh-pages
remote_name: origin

watch:
  - docs
  - py_rpautom

plugins:
  - mkdocstrings:
      handlers:
        python:
          paths: ["py_rpautom"]
          options:
            docstring_style: google
            # Traduz "Parâmetros:", "Retorna:", "Exceções:" e "Exemplos:"
            #   para os rótulos que o parser Google reconhece, mantendo o
            #   cabeçalho em português na página gerada. Sem isso, as
            #   seções virariam blocos de aviso em vez de tabelas.
            extensions:
              - docs/extensoes/traduzir_secoes.py:TraduzirSecoes
            docstring_options:
              returns_multiple_items: false
              # Lê "tipo: descrição" em Retorna: como tipo, não como nome.
              returns_named_value: false
              # A biblioteca ainda não anota todos os parâmetros; sem isso
              #   o build emite um aviso por parâmetro sem anotação.
              warn_missing_types: false
            # Publica apenas o que cada módulo declara em __all__,
            #   deixando as funções internas fora da referência.
            filters: public
            heading_level: 2
            members_order: alphabetical
            show_root_heading: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: true
  - search

hooks:
  - docs/hooks/formatting.py

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite

theme:
  name: material
  language: pt-BR
  locale: pt_BR

  hljs_languages:
      - yaml
      - python

  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: default
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: slate
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

nav:
  - Breve história: historia.md
  - Dependências do projeto: dependencias.md
  - Guia de automação web: guia_usuario/web_utils.md
  - Guia de automação desktop: guia_usuario/desktop_utils.md
  - Guia de utilitários python: guia_usuario/python_utils.md
  - Referência da API:
    - Automação web: referencia/web_utils.md
    - Automação desktop: referencia/desktop_utils.md
    - Utilitários python: referencia/python_utils.md
  - Sobre:
    - Notas de Release: sobre/release-notes.md
    - Licença: sobre/license.md
